# ============================================================
# 持续集成
# ============================================================
# 每次 push 或提交 PR 时自动跑：后端单元测试 + 前端类型检查和构建。
#
# 为什么这个项目的 CI 特别好写：**单元测试不依赖数据库**。
# 计分逻辑和提示词构建都是纯 Java 类，直接 new 出来就能测，
# 所以不需要在 CI 里起 PostgreSQL 服务。
# 这是"把核心逻辑与框架解耦"换来的实际收益之一。
# ============================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一个分支连续推送时，取消上一次还没跑完的任务——
# 省 runner 时间，也避免旧的失败结果干扰判断。
concurrency:
  # 加引号是为了消除歧义：YAML 里裸标量含 { } 虽然合法，
  # 但加引号后不必再去想"这个解析器会不会把它当流式映射"。
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------
  # 后端：跑单元测试
  # ----------------------------------------------------------
  backend:
    name: 后端测试
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          # 缓存 ~/.m2/repository，依赖不变时不重复下载，
          # 第二次之后的构建能快 1~2 分钟
          cache: maven

      - name: 运行单元测试
        working-directory: backend
        run: ./mvnw -B -ntp test

      - name: 上传测试报告
        # 只有失败时才需要看详细报告，成功时不用占存储
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports/
          retention-days: 7

  # ----------------------------------------------------------
  # 前端：类型检查 + 生产构建
  # ----------------------------------------------------------
  frontend:
    name: 前端检查
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          # 仓库根目录没有 package-lock.json，必须显式指出路径，
          # 否则 setup-node 的缓存会静默失效（不报错，只是每次全量下载）
          cache-dependency-path: frontend/package-lock.json

      # 用 ci 而不是 install：严格按 package-lock.json 装，
      # 且 lock 文件和 package.json 不一致时直接失败。
      # 这能防止"本地能跑、CI 装出另一套版本"的问题。
      - name: 安装依赖
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: 类型检查
        working-directory: frontend
        run: npm run typecheck

      - name: 生产构建
        working-directory: frontend
        run: npm run build
