# ============================================================
# nginx 配置：托管 SPA + 代理 API 请求
# ============================================================
# 开发时这些事由 Vite 的 dev server 做（见 vite.config.ts），
# 生产环境换成 nginx 做同样的事。
#
# 这样前端代码里的 fetch('/api/xxx') 在开发和部署时**完全一致**，
# 不需要为环境差异改代码。
# ============================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---------- 静态资源 ----------
    location / {
        # SPA 的关键：找不到文件就回退到 index.html。
        #
        # 没有这一行的话，用户直接访问 /some/path 会得到 nginx 的 404，
        # 因为那个路径在磁盘上不存在——路由其实是由前端 JS 处理的。
        try_files $uri $uri/ /index.html;
    }

    # index.html 不缓存。
    # 它里面引用的是带哈希的 JS/CSS 文件名，所以只要 index.html 是新的，
    # 就会去加载新的资源。反过来如果缓存了 index.html，
    # 用户会在部署后仍然跑旧版本的代码，而且刷新也没用——很难排查。
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # 带哈希的构建产物可以放心长期缓存——内容变了文件名就会变
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ---------- API 代理 ----------
    location /api/ {
        # backend 是 docker-compose 里的服务名。
        # Compose 会给每个服务在内部 DNS 里注册这个名字，
        # 所以容器之间可以直接用它互相访问，不需要知道 IP。
        proxy_pass http://backend:8080;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ⚠️ AI 报告要调大模型，可能跑 3~30 秒。
        # nginx 默认的 60 秒读超时够用，但连接超时默认偏短，这里放宽。
        proxy_connect_timeout 10s;
        proxy_read_timeout    120s;
    }

    # 压缩。文本类资源能压掉 70% 左右。
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # 隐藏 nginx 版本号（少给扫描器一点信息）
    server_tokens off;
}
