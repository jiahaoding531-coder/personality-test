# ============================================================
# Maven Wrapper 配置
# ============================================================
# ⚠️ 这里刻意用**官方地址**而不是国内镜像。
#
# 原因：这个文件在仓库里，会被 GitHub Actions 的 runner 读取，
#       而 runner 在海外——指向阿里云的话 CI 下载会极慢甚至超时。
#
# 本地（国内）怎么办？靠 ~/.m2/settings.xml 里的镜像配置。
# 那个文件是**机器相关的、不在仓库里**，所以你本地走阿里云，
# CI 自动走 Maven Central，两边都是最优解。
#
# 注意 distributionUrl 只影响「Maven 本体」这一次下载
# （约 9MB，已缓存在 ~/.m2/wrapper/ 里，所以改回去对你本地没有影响）；
# 依赖 jar 的下载走的是 settings.xml 里的镜像，与这里无关。
# ============================================================

wrapperVersion=3.3.4
distributionType=only-script
distributionUrl=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.16/apache-maven-3.9.16-bin.zip
