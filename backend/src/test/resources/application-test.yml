# ============================================================
# 测试环境的配置
# ============================================================
# 由 @ActiveProfiles("test") 激活，**只在跑测试时生效**。
# Spring Boot 的配置优先级：application-test.yml > application.yml
# ============================================================

spring:
  datasource:
    # ⚠️ 指向**独立的测试库**，绝不能是开发库。
    #
    # 集成测试会往库里写数据（注册用户、建会话、提交答案）。
    # 如果连的是开发库，跑一次测试就把你手动造的数据搅乱了。
    #
    # 表结构不用手动建——Flyway 在测试启动时会自动跑一遍 V1~V4 迁移。
    # 这顺带还验证了迁移脚本本身是可执行的（CI 里这一点尤其重要）。
    url: jdbc:postgresql://localhost:5432/personality_mvp_test
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    # 关掉 SQL 日志——测试会发出几百条查询，开着会淹掉真正有用的失败信息
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    # 允许 Flyway 在测试里 clean（清空整个 schema 重来）。
    # 生产环境必须是 true（禁止 clean），否则一条命令就能删光所有数据。
    clean-disabled: false

# ============================================================
# AI 配置
# ============================================================
app:
  ai:
    # 测试里**关闭真实 AI 调用**。三个理由：
    #   1. 确定性——大模型输出有随机性，断言没法写
    #   2. 成本——跑一次测试套件就烧一次 token
    #   3. 速度——真实调用要 3~30 秒，测试会慢得没法用
    #
    # 关掉之后装配的是 StubAiReportGenerator，正好用来测
    # "/ai-report 返回 501" 这条路径。
    enabled: false

# ============================================================
# 日志
# ============================================================
logging:
  level:
    root: WARN
    # 本项目自己的日志降到 WARN——测试里业务日志没用，只会刷屏
    com.example.personality: WARN
    # Flyway 的迁移日志留着，能看出迁移是否执行成功
    org.flywaydb: INFO
