# ============================================================
# 应用配置
# ============================================================
# 相当于 Python 项目里的 pyproject.toml + .env 合体。
# Spring Boot 启动时会自动读取 classpath 下的 application.yml。
#
# 语法要点：
#   缩进表示层级（和 Python 一样，不能用 Tab，只能用空格）
#   ${VAR:default} 表示"读环境变量 VAR，读不到就用 default"
# ============================================================

spring:
  application:
    name: personality-test

  # ----------------------------------------------------------
  # 数据库连接
  # ----------------------------------------------------------
  # ⚠️ 安装 PostgreSQL 时你设的密码，需要填到 DB_PASSWORD 里。
  #    推荐做法是设成环境变量，而不是直接写在这里——
  #    这个文件是要提交到 GitHub 的，写死密码等于公开泄露。
  #
  #    Windows PowerShell 里设置（当前窗口有效）：
  #      $env:DB_PASSWORD = "你的密码"
  #    永久生效：
  #      [Environment]::SetEnvironmentVariable("DB_PASSWORD", "你的密码", "User")
  # ----------------------------------------------------------
  datasource:
    # 地址也走环境变量，默认值是本地开发用的 localhost。
    #
    # ⚠️ 容器里 **localhost 指向容器自己**，不是宿主机、更不是数据库容器。
    #    跑 docker compose 时要用 DB_URL 覆盖成服务名：
    #      DB_URL=jdbc:postgresql://postgres:5432/personality_mvp
    url: ${DB_URL:jdbc:postgresql://localhost:5432/personality_mvp}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}

    # HikariCP 是 Spring Boot 默认的连接池，性能最好的 Java 连接池之一。
    # 你写 JdbcCrud.java 时每次操作都新建连接（DriverManager.getConnection），
    # 那个开销很大；连接池会复用连接，这是最重要的性能优化之一。
    hikari:
      maximum-pool-size: 10          # 最大连接数。超过这个数的请求会排队等待
      minimum-idle: 2                # 保持的最小空闲连接
      connection-timeout: 30000      # 等待连接的超时时间（毫秒）
      pool-name: PersonalityHikariPool

  # ----------------------------------------------------------
  # JPA / Hibernate
  # ----------------------------------------------------------
  jpa:
    hibernate:
      # ⚠️ 必须是 validate，不能是 update 或 create。
      #
      # validate   = 启动时检查实体和数据库表对不对得上，对不上就启动失败（✅ 我们要的）
      # update     = Hibernate 自动改表结构（❌ 危险：会和 Flyway 抢管理权，
      #              最终没人知道表到底是谁建的，生产环境绝对禁止）
      # create-drop= 每次启动删表重建（❌ 会把数据清空）
      #
      # 表结构的唯一管理者是 Flyway。Hibernate 只有"检查"的权限，没有"修改"的权限。
      ddl-auto: validate

    # ⚠️ 必须关掉，默认是 true。
    #
    # open-in-view = true 会让 Hibernate 在整个 HTTP 请求期间都持有数据库连接，
    # 好处是能在 Controller 里偷懒访问懒加载字段，坏处是连接被白白占着，
    # 高并发下连接池迅速耗尽。
    #
    # Spring Boot 官方从 3.x 起就建议关掉它。关掉之后所有数据访问
    # 都必须在 Service 层（事务内）完成，会逼着你把边界划清楚。
    open-in-view: false

    properties:
      hibernate:
        format_sql: true             # 日志里的 SQL 自动换行缩进，方便阅读

    # 把执行的 SQL 打到控制台。
    # 学习阶段强烈建议开着——你能直观看到 JPA 到底生成了什么 SQL，
    # 避免把它当成魔法。上线时改成 false（否则日志量巨大且影响性能）。
    show-sql: true

  # ----------------------------------------------------------
  # Flyway 数据库迁移
  # ----------------------------------------------------------
  flyway:
    enabled: true
    locations: classpath:db/migration   # 对应 src/main/resources/db/migration/
    # 让 Flyway 按版本号顺序执行 V1__xxx.sql、V2__xxx.sql。
    # 执行过的脚本会记录在 flyway_schema_history 表里，不会重复执行。
    # 改了已执行过的脚本会导致校验失败——这是特性不是 bug，
    # 保证任何一台机器上跑出来的表结构都完全一致。

# ============================================================
# AI 配置
# ============================================================
# 对应 Java 侧的 AiProperties（@ConfigurationProperties(prefix = "app.ai")）。
# 字段名用中划线风格，Spring 会自动做宽松绑定（base-url ↔ baseUrl）。
# ============================================================
app:
  ai:
    # 是否允许用**服务端配置的这把 key**（也就是"这站替不替访客付钱"）。
    #
    # ⚠️ 这个开关的语义变过，别再按老意思读：
    #
    #   以前：false = 没有 AI（装配桩实现，接口一律 501）
    #   现在：false = 访客没带 key 时**没有兜底**，但访客带上自己的 key 照样能用
    #
    # 所以 false 不再等于"AI 不可用"。真正不可用的情况是
    # "服务端没配 + 访客也没带"，那时才返回 501——
    # 而那是**运行时**的判断了，不再是启动时的 Bean 装配条件。
    #
    # 默认关掉的理由没变：别人 clone 仓库直接跑，不该因为缺个环境变量就报错。
    enabled: ${AI_ENABLED:false}

    # 是否允许访客携带自己的 API Key（BYOK）。
    #
    # 默认 true：这是"把 demo 发给别人看"时唯一不让自己掏钱的形态。
    # 别人打开就能填上自己的 key 用起来，而你一分钱不花。
    #
    # ⚠️ 代价是：部署出去就成了一台"按白名单转发大模型请求"的代理。
    #    风险边界评估过，可以接受——调用者必须自己有厂商侧有效的 key，
    #    且目标地址只来自 AiProvider 白名单（请求里的字符串变不成地址，SSRF 被堵死）。
    #    内部系统如果不想要这个能力，设成 false 即可。
    allow-user-keys: ${AI_ALLOW_USER_KEYS:true}

    # DeepSeek 的 OpenAI 兼容端点。换成通义、智谱、Kimi 多数也兼容这个协议，
    # 只要改这里和 model，Java 代码一行不用动。
    base-url: ${AI_BASE_URL:https://api.deepseek.com/v1}

    # deepseek-chat 是通用对话模型，做人格解读够用，比 reasoner 快且便宜。
    model: ${AI_MODEL:deepseek-chat}

    # ⚠️ API Key 只从环境变量读，绝对不要在这里写明文。
    #    这个文件要提交到 Git，一旦推上去，即使马上删除，
    #    历史提交里依然查得到，爬虫会在几分钟内扫到并盗用额度。
    #
    #    Windows PowerShell（当前窗口有效）：
    #      $env:DEEPSEEK_API_KEY = "sk-你的key"
    #    永久生效：
    #      [Environment]::SetEnvironmentVariable("DEEPSEEK_API_KEY","sk-你的key","User")
    #
    #    冒号后留空 = 读不到环境变量时用空字符串，而不是启动失败。
    #    真正的"缺 Key"检查在 DeepSeekAiReportGenerator 的构造器里做——
    #    只有真的启用了 AI 才需要 Key。
    api-key: ${DEEPSEEK_API_KEY:}

    # 单次请求超时。大模型偶尔会慢，30 秒是够用的上限。
    # 不设超时的话，上游卡住会一直占着请求线程，并发一上来整个服务失去响应。
    timeout: 30s

    # 生成的最大 token 数。400~600 中文字约 800~1200 token。
    max-tokens: 1200

    # 采样温度。人格解读属于创作类任务，用厂商默认值即可。
    # 调低会让每次输出趋同，调高会开始跑题。
    temperature: 1.0

# ============================================================
# 高德地图配置
# ============================================================
# 对应 Java 侧的 AmapProperties（@ConfigurationProperties(prefix = "app.amap")）。
#
# 提供三样东西：逆地理编码（坐标 → 地名）、天气、以及前端的导航跳转
# （最后那个不需要 key，纯粹是个链接）。
#
# ⚠️ 和 app.ai 不同的是：这里提供的是**锦上添花**的数据。
#    高德挂了、超时了、配额用完了，推荐**照常工作**，只是少一个维度。
#    拿不到天气时打分里的 weatherFactor 恒为 1.0（乘法单位元），
#    等于这一项不存在。
# ============================================================
  # ⚠️ 注意缩进：这一段必须**缩在已有的 app: 下面**（和 ai: 平级）。
  #    写成顶格的 `app:` 会变成第二个同名的顶层键，YAML 不允许，
  #    应用直接起不来——报错是 "found duplicate key app"，看着像是
  #    "重复配置"，其实只是缩进少了两格。
  amap:
    # 是否启用真实的高德调用。
    #
    # false（默认）→ 装配桩实现：查不到地名和天气，但一切照常运行
    # true         → 装配真实现：调高德 Web 服务接口
    #
    # 默认关掉的理由同 app.ai：别人 clone 仓库时没有 key，
    # 默认开启会让他一启动就报错。
    enabled: ${AMAP_ENABLED:false}

    # 高德 Web 服务的根地址。
    base-url: ${AMAP_BASE_URL:https://restapi.amap.com}

    # ⚠️ API Key 只从环境变量读，绝对不要在这里写明文。
    #    这个文件要提交到 Git，一旦推上去，即使马上删除，
    #    历史提交里依然查得到，爬虫会在几分钟内扫到并盗用额度。
    #
    # ⚠️ 必须是「Web 服务」类型的 Key，不能是「Web 端(JS API)」类型。
    #    类型不对会返回 infocode 10009（USERKEY_PLAT_NOMATCH）。
    #    （JS API 是给浏览器里直接调用的，Key 会暴露给用户，所以高德
    #      用类型把两者隔开——用错了它不会告诉你该去申请另一个。）
    #
    #    Windows PowerShell（当前窗口有效）：
    #      $env:AMAP_KEY = "你的key"
    #    永久生效：
    #      [Environment]::SetEnvironmentVariable("AMAP_KEY","你的key","User")
    #
    #    也可以写在 application-local.yml 里（该文件已被 .gitignore 忽略）：
    #      app:
    #        amap:
    #          enabled: true
    #          key: 你的key
    #
    #    冒号后留空 = 读不到环境变量时用空字符串，而不是启动失败。
    #    真正的"缺 Key"检查在 AmapClient 的构造器里做——
    #    只有真的启用了高德才需要 Key。
    key: ${AMAP_KEY:}

    # 单次请求超时。默认 5 秒，比 AI 那边的 30 秒短得多：
    # 大模型是"生成内容"，慢是正常的；而查地名/天气是"查一个已经存在的值"，
    # 几百毫秒就该回来。
    #
    # 更要紧的是它在**推荐请求链路**上——用户点一下要等两次外部请求，
    # 每次卡 30 秒的话页面就是转圈转一分钟。宁可超时降级。
    timeout: 5s

    # 天气缓存多久。
    #
    # ⚠️ 这个缓存**不是性能优化，是配额保护**。推荐是"用户点一下就走一次"
    #    的高频操作，而个人 Key 的天气接口有每日调用上限——不缓存的话，
    #    一个下午的反复调试就能把当天额度用光，表现是"天气突然一直没有了"，
    #    很难联想到是这个原因。
    #
    # 按城市（adcode）缓存，同城所有用户共享一份。
    # 高德的实时天气本身十几分钟才更新一次，所以缓 10 分钟和现查没区别。
    weather-cache-ttl: 10m

# ============================================================
# 服务器
# ============================================================
server:
  port: 8080

# ============================================================
# 日志
# ============================================================
logging:
  level:
    root: INFO
    # 本项目自己的日志开 DEBUG，方便看到业务流转
    com.example.personality: DEBUG
    # 想看 Hibernate 绑定了什么参数就打开下面这行（很啰嗦，默认关掉）
    # org.hibernate.orm.jdbc.bind: TRACE
